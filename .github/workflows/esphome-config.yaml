name: ESPHome config 

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_SYSTEM_PYTHON: 1

jobs:
  define-matrix:
    runs-on: ubuntu-latest
    outputs:
      config: ${{ steps.config.outputs.config }}
    steps:
    - uses: actions/checkout@v7
    - name: Define config files
      id: config
      run: |
        CONFIG=$(scripts/find-config.sh)
        echo ${CONFIG}
        echo "config=${CONFIG}" >> "$GITHUB_OUTPUT"

  check-config:
    runs-on: ubuntu-latest
    needs:
      - define-matrix
    strategy:
      matrix:
        config_file: ${{ fromJSON(needs.define-matrix.outputs.config) }}
    steps:
    - uses: actions/checkout@v7
    - name: Install uv
      uses: astral-sh/setup-uv@v10.3.0
      with:
        enable-cache: true
        cache-dependency-glob: "requirements**.txt"

    - name: "Set up Python"
      uses: actions/setup-python@v7
      with:
        python-version-file: ".python-version"

    - name: Cache ESPHome toolchain
      uses: actions/cache@v6
      with:
        path: ~/.cache/esphome
        key: ${{ runner.os }}-esphome-toolchain-${{ hashFiles('.python-version', 'requirements.txt') }}

    - name: Cache ESPHome build
      uses: actions/cache@v6
      with:
        path: "**/.esphome"
        key: ${{ runner.os }}-esphome-build-${{ matrix.config_file }}-${{ hashFiles('.python-version', 'requirements.txt', matrix.config_file) }}
        restore-keys: |
          ${{ runner.os }}-esphome-build-${{ matrix.config_file }}-${{ hashFiles('.python-version', 'requirements.txt') }}-

    - name: Install dependencies
      run: |
        uv pip install -r requirements.txt
  
    - name: Prepare secrets
      run: |
        cp config/secrets-example.yaml sensors/secrets.yaml
        cp config/secrets-example.yaml displays/secrets.yaml
        cp config/secrets-example.yaml camera/secrets.yaml

    - name: Check Compile ${{matrix.config_file}}
      run: |
        esphome compile ${{matrix.config_file}}
