# https://wiki.seeedstudio.com/xiao_7_5_inch_epaper_panel_main_page/

logger:

api:
  encryption:
    key: !secret api_key

# Note: This device does deep sleep so it can't update OTA
ota:
  - platform: esphome
    password: !secret ota_password

json:

esphome:
  name: eink-panel

esp32:
  board: seeed_xiao_esp32c3
  variant: esp32c3
  framework:
    type: esp-idf

# Bus required for the display
spi:
  clk_pin: GPIO8
  mosi_pin: GPIO10

http_request:
  verify_ssl: false
  timeout: 10s
  watchdog_timeout: 15s


globals:
  # Variable turned on/off when Wi-Fi is connected and track refresh interval
  # until data has been loaded. The wifi status is also displayed on the screen.
  - id: wifi_status
    type: int
    restore_value: no
    initial_value: "0"
  - id: update_done
    type: bool
    restore_value: no 
    initial_value: "false"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  domain: !secret domain
  on_connect:
    then:
      - lambda: |-
          id(wifi_status) = 1;
  on_disconnect:
    then:
      - lambda: |-
          id(wifi_status) = 0;

deep_sleep:
  id: deep_sleep_1
  run_duration: 90s  # Fallback timeout if Wi-Fi or Home Assistant is unreachable
  sleep_duration: 30min  # deep sleep for 30min

interval:
  # Wait for Wi-Fi, Home Assistant API, time sync, and weather state before updating
  - interval: 1s
    then:
      - if:
          condition:
            and:
              - wifi.connected:
              - api.connected:
              - lambda: |-
                  return !id(update_done) &&
                         id(homeassistant_time).now().is_valid() &&
                         id(myWeather).has_state() &&
                         id(forecast).has_state();
          then:
            - lambda: "id(update_done) = true;"
            # Brief delay so remaining Home Assistant entity states finish arriving
            - delay: 2s
            - lambda: |-
                ESP_LOGD("Display", "Triggered Display Update...");
            - component.update: wifisignal
            - component.update: internal_temp
            - component.update: uptime_sensor
            - component.update: display_panel
            - if:
                condition:
                  lambda: |-
                    auto now = id(homeassistant_time).now();
                    return now.is_valid() && now.hour < 6;
                then:
                  - logger.log: "Between 12:00AM and 06:00AM — entering deep sleep until 06:00."
                  - deep_sleep.enter:
                      id: deep_sleep_1
                      until: "06:00:00"
                      time_id: homeassistant_time
                else:
                  - logger.log: "Display update complete — entering deep sleep for 30min."
                  - deep_sleep.enter:
                      id: deep_sleep_1


sensor:
  - platform: wifi_signal
    name: "Wifi Signal"
    id: wifisignal
    unit_of_measurement: "dBm"
    entity_category: "diagnostic"
    update_interval: never
  - platform: internal_temperature
    name: "Internal Temperature"
    id: internal_temp
    entity_category: "diagnostic"
    update_interval: never
  - platform: uptime
    name: "Uptime"
    id: uptime_sensor
    entity_category: "diagnostic"
    update_interval: never

button:
  - platform: shutdown
    name: "Shutdown"
    entity_category: config
  - platform: restart
    name: "Restart"
    entity_category: config
  # - platform: template
  #   name: "Refresh Screen"
  #   entity_category: config
  #   on_press:
  #     - script.execute: update_screen

time:
  - platform: homeassistant
    id: homeassistant_time

text_sensor:
  - platform: homeassistant
    entity_id: weather.woodgreen
    id: myWeather
  - platform: homeassistant
    entity_id: weather.woodgreen
    id: temp
    attribute: "temperature"
  - platform: homeassistant
    entity_id: weather.woodgreen
    id: humi
    attribute: "humidity"
  - platform: homeassistant
    entity_id: weather.woodgreen
    id: press
    attribute: "pressure"
  - platform: homeassistant
    entity_id: weather.woodgreen
    id: wind
    attribute: "wind_speed"
  - platform: homeassistant
    entity_id:  sensor.current_uv_index
    id: uv
  - platform: homeassistant
    entity_id:  sensor.current_uv_level
    id: uv_level
  - platform: homeassistant
    entity_id: sensor.daily_weather_forecast_summary
    id: forecast

packages:
  display_ui: !include packages/eink-panel-display.yaml

