substitutions:
  font_dir: "../../config/fonts"
  preview_time: "2026-10-18 14:00:00"
  preview_weather: "sunny"
  preview_temp: "74"
  preview_humi: "28"
  preview_press: "29.98"
  preview_wind: "4.23"
  preview_uv: "2.1222"
  preview_uv_level: "low"
  preview_forecast: "Expect sunny, warm weather through Tuesday, with highs in the 70s-80s. Rain is likely on Wednesday, followed by cooler, partly cloudy conditions with highs near 67°F."
  snapshot_filename: "eink-panel-preview.bmp"

packages:
  preview_common: !include preview-common.yaml
  display_ui: !include eink-panel-display.yaml

esphome:
  name: eink-panel-preview
  on_boot:
    - priority: -100
      then:
      - text_sensor.template.publish:
          id: myWeather
          state: "${preview_weather}"
      - text_sensor.template.publish:
          id: temp
          state: "${preview_temp}"
      - text_sensor.template.publish:
          id: humi
          state: "${preview_humi}"
      - text_sensor.template.publish:
          id: press
          state: "${preview_press}"
      - text_sensor.template.publish:
          id: wind
          state: "${preview_wind}"
      - text_sensor.template.publish:
          id: uv
          state: "${preview_uv}"
      - text_sensor.template.publish:
          id: uv_level
          state: "${preview_uv_level}"
      - text_sensor.template.publish:
          id: forecast
          state: "${preview_forecast}"
      - component.update: display_panel
      - snapshot.take:
          id: display_panel
          filename: "${snapshot_filename}"
      - lambda: |-
          std::exit(0);

globals:
  - id: wifi_status
    type: int
    restore_value: no
    initial_value: '1'

time:
  - platform: host
    id: homeassistant_time
    timezone: "UTC"

text_sensor:
  - platform: template
    id: myWeather
  - platform: template
    id: temp
  - platform: template
    id: humi
  - platform: template
    id: press
  - platform: template
    id: wind
  - platform: template
    id: uv
  - platform: template
    id: uv_level
  - platform: template
    id: forecast

display:
  - platform: snapshot
    id: display_panel
    dimensions: 800x480
